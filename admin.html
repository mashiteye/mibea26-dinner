<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#fbf4e8">
<title>All tables · Dinner Night</title>
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./staff.css">
<style>
.seg{display:inline-flex;margin-top:12px;border:1px solid var(--line-strong);border-radius:999px;padding:3px;background:#fff}
.seg button{min-height:34px;padding:0 14px;border:0;border-radius:999px;background:transparent;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--choc);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--choc);color:var(--ivory)}
#map{display:block;width:100%;height:auto;margin-top:6px}
#map .tbl{cursor:pointer}
#map .tbl:focus{outline:none}
#map .tbl:focus-visible circle.t{stroke:var(--gold-deep);stroke-width:2}
#map text{font-family:var(--sans)}
.legend .open{background:#fff;border-style:dashed}
.legend .sent{background:#e9d7b5}
.legend .confirmed{background:#6f432f;border-color:#6f432f}
.legend .declined{background:#d99a3d;border-color:#d99a3d}
.legend .arrived{background:#3e7a4f;border-color:#3e7a4f}
.legend .check{background:#fff;border:2px solid #a3392b;border-radius:50%}
table.hosts{width:100%;border-collapse:collapse;margin-top:8px;font-size:13px;font-variant-numeric:tabular-nums}
table.hosts th{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--soft);text-align:right;padding:6px 4px;border-bottom:1px solid var(--line)}
table.hosts th:first-child,table.hosts td:first-child{text-align:left}
table.hosts td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;color:var(--choc-deep)}
table.hosts td a{color:var(--choc);font-weight:600;text-decoration:none}
.issues{list-style:none;margin:8px 0 0;padding:0}
.issues li{padding:10px 0;border-top:1px solid var(--line);font-size:13px;line-height:1.45}
.issues li b{display:block;font-size:10px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--bad);margin-bottom:2px}
.issues li.warn b{color:var(--declined-ink)}
.seatlist{list-style:none;margin:10px 0 0;padding:0}
.seatlist li{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
.seatlist .c{width:18px;font-weight:600;color:var(--soft)}
.seatlist .nm{flex:1;color:var(--choc-deep)}
.seatlist .st{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--choc)}
.export{margin-top:16px}
</style>
</head>
<body>
<div class="preview">
  <b>Design preview</b><span>Sample data</span>
  <span class="spacer"></span>
  <a href="./index.html?review">Invitation</a><a href="./host.html">Host board</a><a href="./gate.html">Gate</a><a href="./admin.html" aria-current="page">Overall view</a>
</div>
<header class="top"><div class="in">
  <h1>All tables</h1>
  <div class="sub">Dinner Night · Sunday 20 December</div>
  <div class="chips" id="chips"></div>
  <div class="seg" role="group" aria-label="View"><button type="button" id="vBefore" aria-pressed="true">Before the day</button><button type="button" id="vNight" aria-pressed="false">On the night</button></div>
</div></header>
<main class="wrap">
  <section class="card">
    <div class="card-head"><h2>The room</h2><span>Tap a table for its chairs</span></div>
    <svg id="map" viewBox="0 0 400 560" role="img" aria-label="Twenty tables of nine, coloured by each chair’s status"></svg>
    <div class="legend" id="legend"></div>
  </section>
  <section class="card">
    <div class="card-head"><h2>By host</h2><span>Chairs, not households</span></div>
    <table class="hosts" id="hosts"></table>
  </section>
  <section class="card">
    <div class="card-head"><h2>To check</h2><span id="issueCount"></span></div>
    <ul class="issues" id="issues"></ul>
  </section>
  <button class="btn wide export" id="export" type="button">Export the guest list</button>
</main>

<div class="veil" id="veil"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" inert></section>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="./demo-data.js"></script>
<script>
(function(){
  'use strict';
  var D=window.DEMO,night=false;
  var sheet=document.getElementById('sheet'),veil=document.getElementById('veil'),toast=document.getElementById('toast');
  function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(function(){toast.classList.remove('show');},2400);}
  var FILL={open:'#fff',sent:'#e9d7b5',confirmed:'#6f432f',declined:'#d99a3d',freed:'#d99a3d',arrived:'#3e7a4f',spare:'none'};
  var STROKE={open:'#b7a58c',sent:'#cdb68d',confirmed:'#6f432f',declined:'#d99a3d',freed:'#d99a3d',arrived:'#3e7a4f',spare:'#b7a58c'};
  var LABEL={open:'Open',sent:'Sent',confirmed:'Confirmed',declined:'Declined',freed:'Not coming',arrived:'In',spare:'Spare'};

  /* tables numbered from the entrance up: row 1 (tables 1 to 4) by the door, row 5 (17 to 20) at the front */
  var COLS=[62,154,246,338],ROWS={1:470,2:380,3:290,4:200,5:110};
  function pos(t){var r=Math.ceil(t/4),c=(t-1)%4;return {x:COLS[c],y:ROWS[r]};}
  function tableLabel(t){
    var hosts=D.seats.filter(function(s){return s.table===t&&s.host;}).map(function(s){return s.host;});
    var u=hosts.filter(function(v,i,a){return a.indexOf(v)===i;});
    var fam=D.seats.some(function(s){return s.table===t&&s.family;});
    if(fam)return (u[0]==='mike'?'Michael’s':'Beatrice’s')+' family';
    return u.length>1?'Shared':D.hostName(u[0]);
  }
  function drawMap(){
    var svg='<rect x="110" y="18" width="180" height="30" rx="4" fill="#fffaf2" stroke="#c9a45e" stroke-width="1"/>'+
      '<text x="200" y="37" text-anchor="middle" font-size="12" font-weight="600" fill="#4c2f25">High table</text>';
    for(var t=1;t<=20;t++){
      var p=pos(t),row=D.seats.filter(function(s){return s.table===t;});
      var fam=row[0].family;
      svg+='<g class="tbl" tabindex="0" role="button" aria-label="Table '+t+'" data-t="'+t+'">';
      svg+='<circle class="t" cx="'+p.x+'" cy="'+p.y+'" r="20" fill="#fffaf2" stroke="#c9b48f" stroke-width="1"/>';
      if(fam)svg+='<circle cx="'+p.x+'" cy="'+p.y+'" r="24" fill="none" stroke="#c9a45e" stroke-width="1"/>';
      svg+='<text x="'+p.x+'" y="'+(p.y+5)+'" text-anchor="middle" font-size="14" font-weight="600" fill="#4c2f25">'+t+'</text>';
      row.forEach(function(s,k){
        var a=(-90+40*k)*Math.PI/180,cx=p.x+31*Math.cos(a),cy=p.y+31*Math.sin(a),st=D.seatState(s,night);
        var bad=s.hh&&D.mismatch(s.hh)&&s.hh.chairs[0]===s.code;
        svg+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="4.6" fill="'+FILL[st]+'" stroke="'+(bad?'#a3392b':STROKE[st])+'" stroke-width="'+(bad?2:1)+'"'+(st==='spare'||st==='open'?' stroke-dasharray="2 1.6"':'')+'/>';
      });
      svg+='<text x="'+p.x+'" y="'+(p.y+50)+'" text-anchor="middle" font-size="10.5" fill="#7c6a5f">'+esc(tableLabel(t))+'</text></g>';
    }
    svg+='<text x="200" y="545" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="2" fill="#7c6a5f">ENTRANCE</text>';
    document.getElementById('map').innerHTML=svg;
    var keys=night?['open','sent','confirmed','declined','arrived']:['open','sent','confirmed','declined'];
    document.getElementById('legend').innerHTML=keys.map(function(k){return '<span><i class="'+k+'"></i>'+(k==='declined'?'Declined, replace':k==='arrived'?'In the room':LABEL[k])+'</span>';}).join('')+'<span><i class="check"></i>Number to check</span>';
  }

  function stats(){
    var all={chairs:0,sent:0,confirmed:0,replace:0,open:0,arrived:0};
    var per={};Object.keys(D.HOSTS).forEach(function(k){per[k]={chairs:0,sent:0,confirmed:0,replace:0,open:0,arrived:0};});
    D.seats.forEach(function(s){
      if(!s.host)return;
      var st=D.seatState(s,true),o=per[s.host];
      [all,o].forEach(function(x){
        x.chairs++;
        if(st==='open')x.open++;else if(st==='sent')x.sent++;else if(st==='declined'||st==='freed')x.replace++;
        else{x.confirmed++;if(st==='arrived')x.arrived++;}
      });
    });
    return {all:all,per:per};
  }
  function issues(){
    var list=[];
    D.households.forEach(function(h){if(D.mismatch(h))list.push({cls:'',t:'Numbers differ',m:'Table '+h.table+' · '+esc(h.name)+' ('+esc(D.hostName(h.host))+'). Host entered '+D.fmtPhone(h.hostPhone)+'; the guest confirmed with '+D.fmtPhone(h.guestPhone)+'.'});});
    var by={};D.households.forEach(function(h){if(h.status==='confirmed'){var k=D.last4(h);(by[k]=by[k]||[]).push(h);}});
    Object.keys(by).forEach(function(k){if(by[k].length>1)list.push({cls:'',t:'Shared last four digits · '+k,m:by[k].map(function(h){return 'Table '+h.table+' · '+esc(h.name)+' ('+esc(D.hostName(h.host))+')';}).join('; ')+'. The gate will ask their names.'});});
    var waiting={};D.households.forEach(function(h){if(h.status==='sent')waiting[h.host]=(waiting[h.host]||0)+1;});
    Object.keys(waiting).forEach(function(k){list.push({cls:'warn',t:'Not answered yet',m:esc(D.hostName(k))+' has '+waiting[k]+' invitation'+(waiting[k]>1?'s':'')+' waiting for a reply.'});});
    return list;
  }
  function render(){
    var S=stats(),a=S.all;
    var nIssues=issues();
    var mism=D.households.filter(D.mismatch).length;
    document.getElementById('chips').innerHTML='<span class="chip">'+a.chairs+' chairs</span><span class="chip">'+a.sent+' sent</span><span class="chip ok">'+a.confirmed+' confirmed</span>'+
      (a.replace?'<span class="chip warn">'+a.replace+' to replace</span>':'')+'<span class="chip">'+a.open+' open</span>'+
      (mism?'<span class="chip bad">'+mism+' number'+(mism>1?'s':'')+' to check</span>':'')+
      (night?'<span class="chip ok">'+a.arrived+' of '+a.confirmed+' in</span>':'');
    drawMap();
    var rows='<tr><th>Host</th><th>Chairs</th><th>Sent</th><th>Confirmed</th><th>Replace</th><th>Open</th>'+(night?'<th>In</th>':'')+'</tr>';
    Object.keys(D.HOSTS).forEach(function(k){var o=S.per[k];rows+='<tr><td><a href="./host.html?h='+k+'">'+esc(D.HOSTS[k].name)+'</a></td><td>'+o.chairs+'</td><td>'+o.sent+'</td><td>'+o.confirmed+'</td><td>'+o.replace+'</td><td>'+o.open+'</td>'+(night?'<td>'+o.arrived+'</td>':'')+'</tr>';});
    document.getElementById('hosts').innerHTML=rows;
    document.getElementById('issueCount').textContent=nIssues.length+' item'+(nIssues.length===1?'':'s');
    document.getElementById('issues').innerHTML=nIssues.map(function(i){return '<li class="'+i.cls+'"><b>'+i.t+'</b>'+i.m+'</li>';}).join('');
  }

  var trigger=null;
  function openSheet(inner){trigger=document.activeElement;sheet.innerHTML=inner;sheet.inert=false;sheet.classList.add('show');veil.classList.add('show');var f=sheet.querySelector('button');if(f)f.focus({preventScroll:true});}
  function closeSheet(){sheet.classList.remove('show');veil.classList.remove('show');sheet.inert=true;if(trigger&&trigger.focus)trigger.focus();}
  veil.addEventListener('click',closeSheet);
  document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheet.classList.contains('show'))closeSheet();});
  function tableSheet(t){
    var row=D.seats.filter(function(s){return s.table===t;});
    var html='<h3 id="sheetTitle">Table '+t+'</h3><div class="meta">'+esc(tableLabel(t))+'</div><ul class="seatlist">';
    row.forEach(function(s){
      var st=D.seatState(s,night),h=s.hh;
      var who=!s.host?'Spare chair':h?esc(h.name)+(h.chairs[0]!==s.code?' <span style="color:var(--soft)">(household)</span>':''):'<span style="color:var(--soft)">Not yet invited</span>';
      html+='<li><span class="c">'+s.chair+'</span><span class="nm">'+who+'<br><span style="font-size:11px;color:var(--soft)">'+(s.host?esc(D.hostName(s.host)):'')+(h&&h.status==='confirmed'?' · gate digits '+D.last4(h):'')+'</span></span><span class="st">'+LABEL[st]+'</span></li>';
    });
    openSheet(html+'</ul><div class="stack"><button class="btn wide" id="tClose" type="button">Close</button></div>');
    document.getElementById('tClose').onclick=closeSheet;
  }
  var map=document.getElementById('map');
  map.addEventListener('click',function(e){var g=e.target.closest('.tbl');if(g)tableSheet(+g.getAttribute('data-t'));});
  map.addEventListener('keydown',function(e){var g=e.target.closest('.tbl');if(g&&(e.key==='Enter'||e.key===' ')){e.preventDefault();tableSheet(+g.getAttribute('data-t'));}});
  var vB=document.getElementById('vBefore'),vN=document.getElementById('vNight');
  function setView(n){night=n;vB.setAttribute('aria-pressed',String(!n));vN.setAttribute('aria-pressed',String(n));render();}
  vB.onclick=function(){setView(false);};vN.onclick=function(){setView(true);};
  document.getElementById('export').onclick=function(){showToast('Preview: this downloads the list as a spreadsheet');};
  render();
})();
</script>
</body>
</html>
